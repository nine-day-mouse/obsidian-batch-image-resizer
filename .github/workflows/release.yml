name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # Keeps the tag and manifest.json from drifting apart.
      - name: Verify tag matches manifest version
        run: |
          tag="$GITHUB_REF_NAME"
          version="$(node -p "require('./manifest.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag '$tag' does not match the manifest version '$version'."
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            # Re-running on an existing tag just replaces the assets.
            gh release upload "$tag" main.js manifest.json styles.css --clobber
          else
            gh release create "$tag" \
              --title "$tag" \
              --generate-notes \
              main.js manifest.json styles.css
          fi
